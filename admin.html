<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrador — Brasil Quiz Bíblico</title><style>body{margin:0;font-family:Arial;background:#06150f;color:#fff}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:#0b2419;border:1px solid #24513d;border-radius:20px;padding:20px;margin:14px 0}h1{color:#ffd229}input,button{padding:12px;border-radius:10px;border:1px solid #24513d}input{background:#071b12;color:#fff}button{background:#12c968;font-weight:bold;cursor:pointer}.danger{background:#ef4054;color:#fff}.gold{background:#ffd229}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{text-align:center;background:#09271a;padding:15px;border-radius:14px}.stat b{display:block;font-size:28px}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.toolbar>*{flex:1;min-width:150px}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #24513d;text-align:left}.hidden{display:none!important}.actions{display:flex;gap:5px;flex-wrap:wrap}.small{font-size:13px;color:#a8beb4}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}table{font-size:12px}}</style></head><body><div class="wrap"><section id="login" class="card"><h1>🛡️ Administrador</h1><p class="small">Somente o e-mail definido no Render pode entrar. Um código será enviado para esse e-mail.</p><input id="email" type="email" placeholder="Seu e-mail de administrador"><button onclick="sendCode()">ENVIAR CÓDIGO</button><div id="verify" class="hidden" style="margin-top:12px"><input id="code" maxlength="6" inputmode="numeric" placeholder="Código de 6 dígitos"><button class="gold" onclick="login()">ENTRAR</button></div><p id="msg"></p></section><section id="panel" class="hidden"><div class="card"><div class="toolbar"><div><h1>BRASIL QUIZ BÍBLICO — PAINEL</h1><span class="small">Central administrativa</span></div><button class="danger" onclick="logout()">SAIR</button></div></div><div class="grid"><div class="stat"><b id="total">0</b>Usuários</div><div class="stat"><b id="online">0</b>Online</div><div class="stat"><b id="blocked">0</b>Bloqueados</div><div class="stat"><b id="suspended">0</b>Suspensos</div></div><div class="card"><div class="toolbar"><input id="search" placeholder="Pesquisar ID, nome ou e-mail" oninput="render()"><button onclick="load()">🔄 Atualizar</button></div><div style="overflow:auto"><table><thead><tr><th>Usuário</th><th>Status</th><th>Moedas</th><th>Acessos</th><th>Ações</th></tr></thead><tbody id="users"></tbody></table></div></div></section></div><script>let users=[];async function api(p,o={}){let r=await fetch(p,{credentials:'include',headers:{'Content-Type':'application/json'},...o});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Erro');return d}async function sendCode(){try{await api('/api/admin/request-code',{method:'POST',body:JSON.stringify({email:email.value})});verify.classList.remove('hidden');msg.textContent='Código enviado para seu e-mail.'}catch(e){msg.textContent=e.message}}async function login(){try{await api('/api/admin/verify-code',{method:'POST',body:JSON.stringify({email:email.value,code:code.value})});loginEl();load()}catch(e){msg.textContent=e.message}}function loginEl(){document.getElementById('login').classList.add('hidden');document.getElementById('panel').classList.remove('hidden')}async function logout(){await api('/api/admin/logout',{method:'POST'});location.reload()}async function load(){try{users=(await api('/api/admin/users')).users||[];render()}catch(e){alert(e.message)}}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(){let q=search.value.toLowerCase();let a=users.filter(u=>(u.id+' '+u.name+' '+u.email).toLowerCase().includes(q));usersEl.innerHTML=a.map(u=>{let on=u.online||(u.lastSeen&&Date.now()-new Date(u.lastSeen).getTime()<90000);let st=u.suspended?'Suspenso':u.blocked?'Bloqueado':on?'Online':'Offline';return `<tr><td><b>${esc(u.name||'Sem nome')}</b><br>${esc(u.email||'')}<br><small>${esc(u.id)}</small></td><td>${st}</td><td>🪙 ${Number(u.coins||0).toLocaleString('pt-BR')}</td><td>${u.paidRooms?'🏠 ':''}${u.themesUnlocked?'🎨 ':''}${u.allUnlocked?'👑':''}</td><td class="actions"><button onclick="act('${esc(u.id)}','coins')">🪙</button><button class="gold" onclick="act('${esc(u.id)}','rooms')">🏠</button><button onclick="act('${esc(u.id)}','themes')">🎨</button><button onclick="act('${esc(u.id)}','all')">👑</button>${u.blocked?'<button onclick="act(\''+esc(u.id)+'\',\'unblock\')">🔓</button>':'<button class="danger" onclick="act(\''+esc(u.id)+'\',\'block\')">🚫</button>'}${u.suspended?'<button onclick="act(\''+esc(u.id)+'\',\'activate\')">✅</button>':'<button class="danger" onclick="act(\''+esc(u.id)+'\',\'suspend\')">⏸️</button>'}</td></tr>`}).join('');total.textContent=users.length;online.textContent=users.filter(u=>u.online||(u.lastSeen&&Date.now()-new Date(u.lastSeen).getTime()<90000)).length;blocked.textContent=users.filter(u=>u.blocked).length;suspended.textContent=users.filter(u=>u.suspended).length}async function act(id,action){let amount;if(action==='coins'){amount=prompt('Quantidade de moedas para adicionar:','1000');if(amount===null)return}if(!confirm('Confirmar?'))return;try{await api('/api/admin/user-action',{method:'POST',body:JSON.stringify({userId:id,action,amount:Number(amount)})});load()}catch(e){alert(e.message)}}const usersEl=document.getElementById('users');</script></body></html>
